# CORRIGIDO: sem este arquivo, @SpringBootTest tenta conectar ao MySQL e falha
# com "Connection refused" em qualquer ambiente sem banco rodando (CI/CD, etc.).
# H2 em memória sobe automaticamente com as dependências corrigidas no pom.xml.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect